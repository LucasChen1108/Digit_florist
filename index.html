<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Digit Florist · 数字花坊</title>
  <meta name="description" content="Design a digital bouquet — choose flowers, colours and wrapping, arrange them your way, and send it as a link. 亲手设计一束电子花束，并以链接的形式送出。" />
  <meta name="theme-color" content="#f6efe7" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@500;600&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="studio-page">
  <header class="topbar">
    <a class="brand" href="./">
      <img src="assets/favicon.svg" alt="" width="30" height="30" />
      <span class="brand-name" data-i18n="brand">Digit Florist</span>
    </a>
    <p class="tagline" data-i18n="tagline"></p>
    <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language"><span data-i18n="langLabel">中文</span></button>
  </header>

  <main class="studio">
    <section class="stage-col" aria-label="Bouquet preview">
      <div class="stage" id="stage"></div>
      <div class="stage-bar">
        <span class="pill" id="countPill"></span>
        <span class="rose-note" id="roseNote"></span>
        <div class="stage-actions">
          <button class="icon-btn" data-act="shuffle" type="button" data-i18n-title="shuffle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3.5c2 0 3.2 1 4.5 3l1 1.6c1.3 2 2.5 3.4 4.5 3.4H20M4 17h3.5c1.6 0 2.6-.7 3.6-2M14 7h3.5H20m-2.5-2.5L20 7l-2.5 2.5m0 5L20 17l-2.5 2.5"/></svg>
            <span data-i18n="shuffle"></span>
          </button>
        </div>
      </div>
      <p class="hint" data-i18n="dragHint"></p>
    </section>

    <aside class="panel">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="flowers" class="on"><b>1</b><span data-i18n="tab.flowers"></span></button>
        <button role="tab" data-tab="arrange"><b>2</b><span data-i18n="tab.arrange"></span></button>
        <button role="tab" data-tab="wrap"><b>3</b><span data-i18n="tab.wrap"></span></button>
        <button role="tab" data-tab="card"><b>4</b><span data-i18n="tab.card"></span></button>
      </nav>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </main>

  <footer class="foot" data-i18n="footer"></footer>

  <dialog id="shareDlg" class="dlg">
    <form method="dialog" class="dlg-inner">
      <div class="dlg-art" id="shareArt"></div>
      <h2 data-i18n="shareTitle"></h2>
      <p class="muted" data-i18n="shareDesc"></p>
      <div class="link-row">
        <input id="shareLink" readonly />
        <button type="button" class="btn primary" data-dlg="copy"><span data-i18n="copy"></span></button>
      </div>
      <div class="dlg-actions">
        <button type="button" class="btn" data-dlg="share" id="nativeShare" hidden><span data-i18n="shareBtn"></span></button>
        <button type="button" class="btn" data-dlg="preview"><span data-i18n="preview"></span></button>
        <button type="button" class="btn" data-dlg="download"><span data-i18n="download"></span></button>
      </div>
      <button class="dlg-x" value="close" aria-label="Close">×</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/studio.js"></script>
</body>
</html>
